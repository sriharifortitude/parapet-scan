# Deliberately misconfigured target for the integration tests.
# Bound to loopback only. Read lab/README.md before running this.
services:
  target:
    image: node:22-alpine
    container_name: bastion-lab-target
    working_dir: /app
    command: node server.js
    volumes:
      - ./app:/app:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
